[package]
name = "lepton_jpeg_root"
edition = "2024"
authors = ["Kristof Roomp <kristofr@microsoft.com>"]

[workspace.package]
version = "0.5.9"
edition = "2024"

[profile.release]
debug = true
lto = true

[workspace]
members = ["lib", "dll", "util", "python"]

# Lints allowed because fixing them would need non-trivial restructuring: the coding hot paths
# take many parameters and use index loops over parallel arrays deliberately, JPEG marker names
# (EOI, SOS) are conventionally upper case, and a few thread/channel types are inherently nested.
[workspace.lints.clippy]
too_many_arguments = "allow"
needless_range_loop = "allow"
upper_case_acronyms = "allow"
type_complexity = "allow"

[lints]
workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dev-dependencies]
lepton_jpeg = { path = "lib", features = ["micro_benchmark"] }
rstest = "0.29"
rand = "0.10"
rand_chacha = "0.10"
siphasher = "1"
criterion = "0.8"

[[bench]]
name = "benches"
harness = false