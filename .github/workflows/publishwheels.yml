name: Publish Wheels

permissions:
  contents: read
  
on:
  push:
    tags:
      - "v*.*.*"  # Triggers only for version tag pushes

jobs:
  build:
    name: Build and upload wheels
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.14.10"]

    steps:
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1" # match ms-prod-1.99 in azure-pipelines.yml    
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python-version }}

      # install only the locked build tools (maturin), not the project itself
      - name: Install build tools
        working-directory: python
        run: uv sync --locked --only-group dev

      - name: Build wheel
        working-directory: python
        run: uv run --locked --no-sync maturin build --release

      - name: Upload to PyPI
        working-directory: python
        shell: bash
        run: uv run --locked --no-sync maturin upload --skip-existing $GITHUB_WORKSPACE/target/wheels/*
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
